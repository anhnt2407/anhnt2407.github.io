<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VAE+DDPG brochure card</title>
  <desc id="desc">Visual summary of the VAE+DDPG paper on attention-enhanced latent representations for low-light autonomous navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e7dcc5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f2e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1058" cy="118" r="132" fill="#dfeaf6"/>
  <circle cx="1112" cy="614" r="150" fill="#f6ebd7"/>
  <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#b6bfd0" stroke-width="2"/>
  <text x="84" y="102" fill="#1c4366" font-family="Arial, sans-serif" font-size="22" font-weight="700">Journal Article - February 22, 2026</text>
  <text x="84" y="170" fill="#1f3046" font-family="Georgia, serif" font-size="50" font-weight="700">
    <tspan x="84" dy="0">VAE+DDPG for</tspan>
    <tspan x="84" dy="56">Low-Light Navigation</tspan>
  </text>
  <text x="84" y="302" fill="#59697d" font-family="Arial, sans-serif" font-size="25">
    <tspan x="84" dy="0">Attention-enhanced VAE+ features and jointly tuned DDPG</tspan>
    <tspan x="84" dy="34">for robust indoor autonomy when dim light weakens depth sensing.</tspan>
  </text>
  <rect x="84" y="440" width="210" height="112" rx="20" fill="#1e5d8c"/>
  <rect x="312" y="440" width="210" height="112" rx="20" fill="#2a6f70"/>
  <rect x="540" y="440" width="210" height="112" rx="20" fill="#8a6423"/>
  <text x="104" y="476" fill="#dceaf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">PERCEPTION</text>
  <text x="104" y="512" fill="#ffffff" font-family="Georgia, serif" font-size="27" font-weight="700">FPN + CBAM VAE+</text>
  <text x="332" y="476" fill="#d9f0ef" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONTROL</text>
  <text x="332" y="512" fill="#ffffff" font-family="Georgia, serif" font-size="27" font-weight="700">Jointly tuned DDPG</text>
  <text x="560" y="476" fill="#f5ead3" font-family="Arial, sans-serif" font-size="18" font-weight="700">DEPLOYMENT</text>
  <text x="560" y="512" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">10 Hz on RTX 4070</text>
  <rect x="804" y="122" width="292" height="434" rx="28" fill="#1a314f"/>
  <text x="842" y="158" fill="#dbe8f5" font-family="Arial, sans-serif" font-size="19" font-weight="700">BROCHURE INSIGHTS</text>
  <rect x="850" y="186" width="84" height="56" rx="14" fill="#dae7f5"/>
  <rect x="966" y="186" width="84" height="56" rx="14" fill="#dae7f5"/>
  <rect x="908" y="270" width="84" height="56" rx="14" fill="#efdfbf"/>
  <text x="866" y="220" fill="#1e466b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Low light</text>
  <text x="990" y="220" fill="#1e466b" font-family="Arial, sans-serif" font-size="18" font-weight="700">VAE+</text>
  <text x="928" y="304" fill="#7d5717" font-family="Arial, sans-serif" font-size="18" font-weight="700">DDPG</text>
  <line x1="934" y1="242" x2="934" y2="270" stroke="#f0c46b" stroke-width="8" stroke-linecap="round"/>
  <line x1="1008" y1="242" x2="976" y2="270" stroke="#6bc6d8" stroke-width="8" stroke-linecap="round"/>
  <path d="M874 362 C918 322 984 322 1028 362" fill="none" stroke="#6bc6d8" stroke-width="8" stroke-linecap="round"/>
  <path d="M874 390 C918 350 984 350 1028 390" fill="none" stroke="#f0c46b" stroke-width="8" stroke-linecap="round"/>
  <text x="842" y="474" fill="#dbe8f5" font-family="Arial, sans-serif" font-size="18" font-weight="700">Latent code shifts toward geometry, not intensity</text>
  <text x="842" y="504" fill="#dbe8f5" font-family="Arial, sans-serif" font-size="18" font-weight="700">Strong low-light performance in cluttered Gazebo scenes</text>
  <text x="842" y="534" fill="#dbe8f5" font-family="Arial, sans-serif" font-size="18" font-weight="700">Unseen-maze transfer drops only about three points</text>
  <text x="84" y="610" fill="#1c4366" font-family="Arial, sans-serif" font-size="18" font-weight="700">Advanced Intelligent Systems - Open access article e202500636</text>
  <text x="84" y="638" fill="#607286" font-family="Arial, sans-serif" font-size="17">Verified from Wiley/Crossref metadata, the public code repository, and public abstract indexing.</text>
</svg>
