        <rect x="850" y="180" width="78" height="52" rx="14" fill="#d5e8f7"/>  <text x="868" y="213" fill="#0b3457" font-family="Arial, sans-serif" font-size="18" font-weight="700">Failure</text>  <rect x="950" y="180" width="78" height="52" rx="14" fill="#d5e8f7"/>  <text x="968" y="213" fill="#0b3457" font-family="Arial, sans-serif" font-size="18" font-weight="700">HA</text>  <rect x="900" y="270" width="78" height="52" rx="14" fill="#b8d7ed"/>  <text x="918" y="303" fill="#0b3457" font-family="Arial, sans-serif" font-size="18" font-weight="700">LM</text>
