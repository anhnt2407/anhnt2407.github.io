<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
        <title id="title">Edge Availability under / Correlated Failures brochure card</title>
        <desc id="desc">SRN modeling with Capacity-Oriented Availability for HA and live-migration trade-offs in edge recovery.</desc>
