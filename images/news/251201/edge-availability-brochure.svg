  <tspan x="84" dy="0">SRN modeling with Capacity-Oriented Availability for</tspan>
  <tspan x="84" dy="34">HA and live-migration trade-offs in edge recovery.</tspan>
</text>
        <rect x="84" y="432" width="210" height="112" rx="22" fill="#0f4c81"/>  <text x="106" y="468" fill="#d7ebfb" font-family="Arial, sans-serif" font-size="18" font-weight="700">MODEL EXTENSION</text>  <text x="106" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">Correlated SRN</text>  <rect x="312" y="432" width="210" height="112" rx="22" fill="#176476"/>  <text x="334" y="468" fill="#d9eff4" font-family="Arial, sans-serif" font-size="18" font-weight="700">RECOVERY VIEW</text>  <text x="334" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">HA vs HA+LM</text>  <rect x="540" y="432" width="210" height="112" rx="22" fill="#5c6b8c"/>  <text x="562" y="468" fill="#e5e8f4" font-family="Arial, sans-serif" font-size="18" font-weight="700">KEY THRESHOLD</text>  <text x="562" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">5 nodes</text>
