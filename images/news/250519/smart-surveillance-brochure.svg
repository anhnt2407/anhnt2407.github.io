<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart surveillance brochure card</title>
  <desc id="desc">Visual summary of the SBRC 2025 paper on SPN-based edge-fog analysis for intelligent camera surveillance in smart buildings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8fd"/>
      <stop offset="100%" stop-color="#dfe5fb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef1fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1062" cy="124" r="124" fill="#ebeffd"/>
  <circle cx="1088" cy="618" r="132" fill="#eef2fd"/>
  <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#9cadde" stroke-width="2"/>
  <text x="84" y="102" fill="#344f9d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Conference Paper - May 19, 2025</text>
  <text x="84" y="170" fill="#263a79" font-family="Georgia, serif" font-size="48" font-weight="700">
    <tspan x="84" dy="0">Edge-Fog Planning for</tspan>
    <tspan x="84" dy="56">Smart Building Surveillance</tspan>
  </text>
  <text x="84" y="302" fill="#5b6786" font-family="Arial, sans-serif" font-size="25">
    <tspan x="84" dy="0">SPN-based capacity analysis for real-time camera analytics,</tspan>
    <tspan x="84" dy="34">response time control, and drop-probability reduction.</tspan>
  </text>
  <rect x="84" y="430" width="216" height="112" rx="22" fill="#3d5ec1"/>
  <rect x="318" y="430" width="216" height="112" rx="22" fill="#4956a7"/>
  <rect x="552" y="430" width="216" height="112" rx="22" fill="#7d4ca4"/>
  <text x="106" y="468" fill="#e1e7fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">FOG SCALE-UP</text>
  <text x="106" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">10 cores</text>
  <text x="340" y="468" fill="#e7e4fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">DROP PROB.</text>
  <text x="340" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">~35%</text>
  <text x="574" y="468" fill="#f0e0fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">RESPONSE TIME</text>
  <text x="574" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">&lt; 10 ms</text>
  <rect x="812" y="124" width="284" height="430" rx="28" fill="#263a79"/>
  <rect x="862" y="196" width="38" height="168" fill="#d7e0fb"/>
  <rect x="914" y="162" width="38" height="202" fill="#c2cff8"/>
  <rect x="966" y="132" width="38" height="232" fill="#a8bbf1"/>
  <rect x="1018" y="228" width="38" height="136" fill="#d7e0fb"/>
  <circle cx="880" cy="146" r="18" fill="#f3c96a"/>
  <path d="M880 164 L854 188 H906 Z" fill="#f3c96a"/>
  <path d="M880 364 C910 414 954 414 984 364" fill="none" stroke="#74c0e0" stroke-width="8" stroke-linecap="round"/>
  <path d="M880 392 C922 438 980 438 1022 392" fill="none" stroke="#66cf8d" stroke-width="8" stroke-linecap="round"/>
  <text x="846" y="508" fill="#d8e2f8" font-family="Arial, sans-serif" font-size="18" font-weight="700">SPN guidance for camera, edge, and fog capacity.</text>
  <text x="84" y="610" fill="#344f9d" font-family="Arial, sans-serif" font-size="18" font-weight="700">SBRC 2025 proceedings - verified from Crossref and the official proceedings page.</text>
  <text x="84" y="638" fill="#63708d" font-family="Arial, sans-serif" font-size="17">Proceedings note 74 accepted full papers from 203 submissions (36.5% acceptance rate).</text>
</svg>
