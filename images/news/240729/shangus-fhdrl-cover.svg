<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scientific illustration of SHANGUS and FH-DRL autonomous exploration</title>
  <desc id="desc">A robot explores an unknown occupancy grid using frontier heuristics, deep reinforcement learning, and dynamic obstacle-aware navigation.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="0.55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#eefbf8"/>
    </linearGradient>
    <pattern id="cells" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2457a6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#102a5f" flood-opacity="0.17"/>
    </filter>
    <style>
      .wall{fill:#20324b;opacity:.14}
      .known{fill:#16a3a1;opacity:.12}
      .frontier{fill:#f0b429;stroke:#bd7f08;stroke-width:4}
      .route{fill:none;stroke:#2457a6;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .route-alt{fill:none;stroke:#16a3a1;stroke-width:5;stroke-linecap:round;stroke-dasharray:14 16}
      .node{fill:#fff;stroke:#2457a6;stroke-width:6}
      .panel{fill:rgba(255,255,255,.84);stroke:rgba(36,87,166,.24);stroke-width:2}
      .ink{fill:#102a5f;font-family:Arial,sans-serif;font-weight:800;letter-spacing:0}
      .small{font-size:24px}
      .label{font-size:30px}
      .robot{fill:#fff;stroke:#102a5f;stroke-width:6;stroke-linejoin:round}
      .sensor{fill:none;stroke:#16a3a1;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#field)"/>
  <rect width="1200" height="675" rx="34" fill="url(#cells)"/>
  <path d="M0 520C186 430 315 546 482 472C638 403 754 452 884 388C1002 329 1106 320 1200 304V675H0Z" fill="#2457a6" opacity="0.08"/>

  <g transform="translate(112 142)">
    <rect class="known" x="0" y="0" width="956" height="396" rx="26"/>
    <rect class="wall" x="62" y="64" width="166" height="44" rx="12"/>
    <rect class="wall" x="744" y="58" width="116" height="160" rx="12"/>
    <rect class="wall" x="250" y="176" width="76" height="142" rx="12"/>
    <rect class="wall" x="462" y="80" width="186" height="50" rx="12"/>
    <rect class="wall" x="556" y="248" width="192" height="54" rx="12"/>
    <circle class="frontier" cx="160" cy="256" r="24"/>
    <circle class="frontier" cx="392" cy="102" r="24"/>
    <circle class="frontier" cx="708" cy="180" r="24"/>
    <circle class="frontier" cx="826" cy="316" r="24"/>
    <path class="route" d="M118 326C190 278 260 306 330 238S458 112 572 168S674 242 778 206"/>
    <path class="route-alt" d="M118 326C276 390 456 362 568 286S736 246 826 316"/>
    <circle class="node" cx="118" cy="326" r="30"/>
    <circle class="node" cx="330" cy="238" r="24"/>
    <circle class="node" cx="572" cy="168" r="24"/>
    <circle class="node" cx="778" cy="206" r="24"/>
  </g>

  <g transform="translate(156 424)" filter="url(#shadow)">
    <circle class="robot" cx="76" cy="76" r="54"/>
    <circle fill="#2457a6" cx="76" cy="76" r="18"/>
    <path class="sensor" d="M76 18C126 28 164 58 184 102"/>
    <path class="sensor" d="M76 18C46 46 34 82 44 124"/>
    <circle class="node" cx="30" cy="126" r="14"/>
    <circle class="node" cx="184" cy="102" r="14"/>
  </g>

  <g transform="translate(72 64)">
    <rect class="panel" width="396" height="118" rx="24"/>
    <text class="ink label" x="32" y="46">SHANGUS / FH-DRL</text>
    <text class="ink small" x="32" y="82" opacity="0.74">frontier heuristics meet deep RL exploration</text>
  </g>

  <g transform="translate(748 472)">
    <rect class="panel" width="360" height="108" rx="24"/>
    <text class="ink small" x="28" y="42">Exploration score</text>
    <path d="M30 78C86 42 122 88 178 58S260 44 324 70" fill="none" stroke="#2457a6" stroke-width="6" stroke-linecap="round"/>
    <circle fill="#f0b429" cx="178" cy="58" r="10"/>
    <circle fill="#16a3a1" cx="324" cy="70" r="10"/>
  </g>
</svg>
