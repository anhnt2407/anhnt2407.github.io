<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hyperledger Fabric brochure card</title>
  <desc id="desc">Visual summary of the ICT Express paper on stochastic Petri net modeling of transaction dynamics in Hyperledger Fabric.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#dce8fb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1072" cy="124" r="124" fill="#e7f0fd"/>
  <circle cx="116" cy="610" r="100" fill="#eef5fd"/>
  <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#9bb9e1" stroke-width="2"/>
  <text x="84" y="102" fill="#124373" font-family="Arial, sans-serif" font-size="22" font-weight="700">Journal Article - February 2025</text>
  <text x="84" y="170" fill="#18375b" font-family="Georgia, serif" font-size="50" font-weight="700">
    <tspan x="84" dy="0">Hyperledger Fabric</tspan>
    <tspan x="84" dy="56">Transaction Dynamics</tspan>
  </text>
  <text x="84" y="302" fill="#54677c" font-family="Arial, sans-serif" font-size="25">
    <tspan x="84" dy="0">SPN-based performance evaluation of permissioned blockchain</tspan>
    <tspan x="84" dy="34">response time, throughput, and resource-sensitive tuning.</tspan>
  </text>
  <rect x="84" y="432" width="216" height="112" rx="22" fill="#0f4c81"/>
  <rect x="318" y="432" width="216" height="112" rx="22" fill="#176476"/>
  <rect x="552" y="432" width="216" height="112" rx="22" fill="#5a6289"/>
  <text x="108" y="468" fill="#d5e8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">MODEL CONFIDENCE</text>
  <text x="108" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="32" font-weight="700">95% interval</text>
  <text x="342" y="468" fill="#d7f0f3" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONFIG IMPACT</text>
  <text x="342" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">Up to 200%</text>
  <text x="576" y="468" fill="#e3e5f1" font-family="Arial, sans-serif" font-size="18" font-weight="700">OPERATOR USE</text>
  <text x="576" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">Pre-deployment planning</text>
  <rect x="808" y="124" width="288" height="430" rx="28" fill="#17304b"/>
  <rect x="860" y="176" width="76" height="48" rx="12" fill="#cfe2f8"/>
  <rect x="946" y="176" width="76" height="48" rx="12" fill="#cfe2f8"/>
  <rect x="903" y="258" width="76" height="48" rx="12" fill="#b0d2ef"/>
  <line x1="898" y1="224" x2="940" y2="258" stroke="#7bb7e4" stroke-width="7" stroke-linecap="round"/>
  <line x1="984" y1="224" x2="942" y2="258" stroke="#7bb7e4" stroke-width="7" stroke-linecap="round"/>
  <rect x="864" y="348" width="164" height="76" rx="16" fill="#f2cc77"/>
  <text x="900" y="380" fill="#6c5116" font-family="Arial, sans-serif" font-size="18" font-weight="700">Block size</text>
  <text x="883" y="406" fill="#6c5116" font-family="Arial, sans-serif" font-size="16">transaction rate tuning</text>
  <path d="M860 476 H922" stroke="#58c6dd" stroke-width="8" stroke-linecap="round"/>
  <path d="M860 508 H980" stroke="#58c6dd" stroke-width="8" stroke-linecap="round"/>
  <path d="M860 540 H946" stroke="#58c6dd" stroke-width="8" stroke-linecap="round"/>
  <text x="84" y="610" fill="#124373" font-family="Arial, sans-serif" font-size="18" font-weight="700">ICT Express - Volume 11, Issue 1, Pages 87-92</text>
  <text x="84" y="638" fill="#607389" font-family="Arial, sans-serif" font-size="17">Verified from ScienceDirect highlights, abstract, and DOI metadata.</text>
</svg>
