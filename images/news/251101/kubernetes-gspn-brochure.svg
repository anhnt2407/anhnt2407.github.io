<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes microservices brochure card</title>
  <desc id="desc">Visual summary of the paper on energy-efficient performance optimization in Kubernetes microservices using Generalized Stochastic Petri Nets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbf6"/>
      <stop offset="100%" stop-color="#dbeedb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1070" cy="130" r="118" fill="#e4f2e2"/>
  <circle cx="150" cy="640" r="115" fill="#edf7ec"/>
  <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#98c7a1" stroke-width="2"/>
  <text x="84" y="102" fill="#22543d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Journal Article - November 2025</text>
  <text x="84" y="170" fill="#1d3b2d" font-family="Georgia, serif" font-size="48" font-weight="700">
    <tspan x="84" dy="0">Energy-aware</tspan>
    <tspan x="84" dy="56">Kubernetes Autoscaling</tspan>
  </text>
  <text x="84" y="302" fill="#506a59" font-family="Arial, sans-serif" font-size="25">
    <tspan x="84" dy="0">GSPN modeling of HPA, cluster autoscaling, workload,</tspan>
    <tspan x="84" dy="34">response time, throughput, and electrical consumption.</tspan>
  </text>
  <rect x="84" y="430" width="212" height="118" rx="22" fill="#256b45"/>
  <rect x="314" y="430" width="212" height="118" rx="22" fill="#0f6b78"/>
  <rect x="544" y="430" width="212" height="118" rx="22" fill="#8d6a15"/>
  <text x="104" y="468" fill="#d9f3e3" font-family="Arial, sans-serif" font-size="18" font-weight="700">LOW LOAD</text>
  <text x="104" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="36" font-weight="700">32% less energy</text>
  <text x="334" y="468" fill="#d7f1f5" font-family="Arial, sans-serif" font-size="18" font-weight="700">HIGH LOAD</text>
  <text x="334" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">175% slower RT</text>
  <text x="564" y="468" fill="#f7eccf" font-family="Arial, sans-serif" font-size="18" font-weight="700">BALANCE METRIC</text>
  <text x="564" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">ERWP</text>
  <rect x="798" y="118" width="298" height="440" rx="28" fill="#163b45"/>
  <rect x="848" y="182" width="82" height="58" rx="12" fill="#dff0f4"/>
  <rect x="942" y="182" width="82" height="58" rx="12" fill="#dff0f4"/>
  <rect x="895" y="266" width="82" height="58" rx="12" fill="#bfe1e8"/>
  <line x1="889" y1="240" x2="936" y2="266" stroke="#83c3d0" stroke-width="6" stroke-linecap="round"/>
  <line x1="983" y1="240" x2="936" y2="266" stroke="#83c3d0" stroke-width="6" stroke-linecap="round"/>
  <rect x="860" y="356" width="160" height="78" rx="16" fill="#f3dca1"/>
  <text x="884" y="388" fill="#5b460d" font-family="Arial, sans-serif" font-size="18" font-weight="700">Autoscaling policy</text>
  <text x="900" y="414" fill="#5b460d" font-family="Arial, sans-serif" font-size="16">threshold trade-offs</text>
  <path d="M844 476 C886 450 936 450 978 476" fill="none" stroke="#57c08a" stroke-width="8" stroke-linecap="round"/>
  <path d="M844 508 C886 478 936 478 978 508" fill="none" stroke="#f0c05d" stroke-width="8" stroke-linecap="round"/>
  <text x="840" y="548" fill="#d6eaef" font-family="Arial, sans-serif" font-size="18" font-weight="700">Performance and energy must be tuned together.</text>
  <text x="84" y="610" fill="#22543d" font-family="Arial, sans-serif" font-size="18" font-weight="700">Journal of Network and Computer Applications</text>
  <text x="84" y="638" fill="#5a7163" font-family="Arial, sans-serif" font-size="17">Published in Volume 243 (November 2025) - verified from ScienceDirect and DOI metadata.</text>
</svg>
