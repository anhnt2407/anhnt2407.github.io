<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">S-iNAS brochure card</title>
  <desc id="desc">Visual summary of the S-iNAS paper on SRN-based scaling analysis for Ceph-backed industrial network-attached storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#d7e9f6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6fb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="120" fill="#d6ebf7"/>
  <circle cx="1120" cy="610" r="140" fill="#e5f3fb"/>
  <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#91b8d3" stroke-width="2"/>
  <text x="84" y="102" fill="#0b3457" font-family="Arial, sans-serif" font-size="22" font-weight="700">Journal Article - December 5, 2025</text>
  <text x="84" y="170" fill="#17304b" font-family="Georgia, serif" font-size="50" font-weight="700">
    <tspan x="84" dy="0">S-iNAS for Adaptive</tspan>
    <tspan x="84" dy="56">Ceph Storage Scaling</tspan>
  </text>
  <text x="84" y="302" fill="#4f6476" font-family="Arial, sans-serif" font-size="25">
    <tspan x="84" dy="0">Performance-centric SRN modeling of time-based and</tspan>
    <tspan x="84" dy="34">event-based expansion for industrial network-attached storage.</tspan>
  </text>
  <rect x="84" y="440" width="210" height="110" rx="20" fill="#0f4c81"/>
  <rect x="312" y="440" width="210" height="110" rx="20" fill="#175d74"/>
  <rect x="540" y="440" width="210" height="110" rx="20" fill="#3b6f5d"/>
  <text x="104" y="476" fill="#d7ebfb" font-family="Arial, sans-serif" font-size="18" font-weight="700">POLICY VIEW</text>
  <text x="104" y="512" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">Time vs Event</text>
  <text x="332" y="476" fill="#d8f1f9" font-family="Arial, sans-serif" font-size="18" font-weight="700">SYSTEM MODEL</text>
  <text x="332" y="512" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">Ceph OSD SRN</text>
  <text x="560" y="476" fill="#ddf3ea" font-family="Arial, sans-serif" font-size="18" font-weight="700">TARGET</text>
  <text x="560" y="512" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">Low Latency</text>
  <rect x="808" y="126" width="280" height="420" rx="26" fill="#0c3658"/>
  <rect x="848" y="186" width="92" height="58" rx="14" fill="#d3e8f8"/>
  <rect x="956" y="186" width="92" height="58" rx="14" fill="#d3e8f8"/>
  <rect x="848" y="264" width="92" height="58" rx="14" fill="#b9d7ee"/>
  <rect x="956" y="264" width="92" height="58" rx="14" fill="#b9d7ee"/>
  <rect x="848" y="342" width="92" height="58" rx="14" fill="#99c2e1"/>
  <rect x="956" y="342" width="92" height="58" rx="14" fill="#99c2e1"/>
  <path d="M798 214 H836" stroke="#0f4c81" stroke-width="10" stroke-linecap="round"/>
  <path d="M798 292 H836" stroke="#175d74" stroke-width="10" stroke-linecap="round"/>
  <path d="M798 370 H836" stroke="#3b6f5d" stroke-width="10" stroke-linecap="round"/>
  <path d="M895 432 C932 386 990 386 1028 432" fill="none" stroke="#5ac0df" stroke-width="8" stroke-linecap="round"/>
  <path d="M895 458 C932 414 990 414 1028 458" fill="none" stroke="#f2c25c" stroke-width="8" stroke-linecap="round"/>
  <text x="844" y="502" fill="#d5e8f6" font-family="Arial, sans-serif" font-size="18" font-weight="700">Time-based = stable under moderate load</text>
  <text x="844" y="532" fill="#d5e8f6" font-family="Arial, sans-serif" font-size="18" font-weight="700">Event-based = faster reaction to spikes</text>
  <text x="84" y="610" fill="#0b3457" font-family="Arial, sans-serif" font-size="18" font-weight="700">Journal of Network and Systems Management</text>
  <text x="84" y="638" fill="#5a7084" font-family="Arial, sans-serif" font-size="17">Published online December 5, 2025 - verified from Springer and DOI metadata.</text>
</svg>
