<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Distributed edge storage brochure card</title>
  <desc id="desc">Visual summary of the Mathematics paper on proactive high availability for distributed edge storage systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.52" stop-color="#eef6f2"/>
      <stop offset="1" stop-color="#fff7e8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17395c"/>
      <stop offset="1" stop-color="#0c5b55"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16324d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="567" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="86" y="86" width="480" height="503" rx="22" fill="url(#panel)"/>
  <text x="126" y="144" fill="#bdebdc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">MATHEMATICS 2026 - 14(10), 1704</text>
  <text x="126" y="198" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800">Distributed Edge</text>
  <text x="126" y="244" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800">Storage Systems</text>
  <text x="126" y="292" fill="#dbe9f1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Proactive high-availability microservices</text>
  <text x="126" y="324" fill="#dbe9f1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">with live migration and rejuvenation</text>

  <g transform="translate(126 374)">
    <rect x="0" y="0" width="378" height="58" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="22" y="36" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">SRN model + policy comparison</text>
    <rect x="0" y="80" width="378" height="58" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="22" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Capacity-Oriented Availability</text>
    <rect x="0" y="160" width="378" height="58" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="22" y="196" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Avoid Proactive Crash timing</text>
  </g>

  <g transform="translate(630 102)">
    <text x="0" y="0" fill="#17395c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Availability policy flow</text>
    <text x="0" y="34" fill="#5c6f84" font-family="Arial, Helvetica, sans-serif" font-size="17">Coordinate recovery actions before services are terminated.</text>

    <g transform="translate(0 72)">
      <rect x="0" y="0" width="156" height="92" rx="16" fill="#eaf3fb" stroke="#9dc3de" stroke-width="2"/>
      <text x="78" y="39" text-anchor="middle" fill="#17395c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Failure</text>
      <text x="78" y="65" text-anchor="middle" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="15">detect / repair</text>

      <path d="M168 46 H229" stroke="#7493a7" stroke-width="4" stroke-linecap="round"/>
      <path d="M229 46 l-13 -9 v18 z" fill="#7493a7"/>

      <rect x="242" y="0" width="156" height="92" rx="16" fill="#e8f7f2" stroke="#7fbfae" stroke-width="2"/>
      <text x="320" y="39" text-anchor="middle" fill="#0c5b55" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Live</text>
      <text x="320" y="65" text-anchor="middle" fill="#47776f" font-family="Arial, Helvetica, sans-serif" font-size="15">migration</text>

      <path d="M410 46 H471" stroke="#7493a7" stroke-width="4" stroke-linecap="round"/>
      <path d="M471 46 l-13 -9 v18 z" fill="#7493a7"/>

      <rect x="484" y="0" width="156" height="92" rx="16" fill="#fff0d8" stroke="#e5af5e" stroke-width="2"/>
      <text x="562" y="39" text-anchor="middle" fill="#7d4d00" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Rejuvenate</text>
      <text x="562" y="65" text-anchor="middle" fill="#836033" font-family="Arial, Helvetica, sans-serif" font-size="15">after evacuation</text>
    </g>

    <g transform="translate(0 218)">
      <rect x="0" y="0" width="244" height="140" rx="18" fill="#f7fbff" stroke="#d8e5ef"/>
      <text x="26" y="39" fill="#17395c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">Six scenarios</text>
      <text x="26" y="73" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="17">HA, live migration,</text>
      <text x="26" y="99" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="17">node and microservice</text>
      <text x="26" y="125" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="17">rejuvenation policies</text>

      <rect x="274" y="0" width="244" height="140" rx="18" fill="#f7fbff" stroke="#d8e5ef"/>
      <text x="300" y="39" fill="#17395c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">Twelve timings</text>
      <text x="300" y="73" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="17">Sensitivity over failure,</text>
      <text x="300" y="99" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="17">repair, detection, and</text>
      <text x="300" y="125" fill="#4b6480" font-family="Arial, Helvetica, sans-serif" font-size="17">rejuvenation intervals</text>
    </g>

    <g transform="translate(0 405)">
      <rect x="0" y="0" width="640" height="92" rx="18" fill="#17395c"/>
      <text x="28" y="36" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">Key guidance</text>
      <text x="28" y="66" fill="#dbe9f1" font-family="Arial, Helvetica, sans-serif" font-size="18">Live migration should complete before rejuvenation starts.</text>
    </g>
  </g>

  <text x="86" y="634" fill="#6b7a88" font-family="Arial, Helvetica, sans-serif" font-size="16">DOI: 10.3390/math14101704</text>
</svg>
