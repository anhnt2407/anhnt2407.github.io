<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
        <title id="title">Vehicle Digital Twin / under Steady Wind brochure card</title>
        <desc id="desc">Integration and early flight-simulation results for the KADA KP2-c eVTOL across light and moderate steady-wind cases.</desc>
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f5fbff"/>
            <stop offset="100%" stop-color="#dbe7f4"/>
          </linearGradient>
          <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#eff4fb"/>
          </linearGradient>
        </defs>
        <rect width="1200" height="720" fill="url(#bg)"/>
        <circle cx="1060" cy="116" r="124" fill="#dce9f9"/>
        <circle cx="1094" cy="610" r="138" fill="#f5fbff"/>
        <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#9ab4d2" stroke-width="2"/>
        <text x="84" y="102" fill="#1f4c77" font-family="Arial, sans-serif" font-size="22" font-weight="700">Conference Paper - April 2, 2025</text>
        <text x="84" y="170" fill="#18324d" font-family="Georgia, serif" font-size="50" font-weight="700">
  <tspan x="84" dy="0">Vehicle Digital Twin</tspan>
  <tspan x="84" dy="56">under Steady Wind</tspan>
</text>
        <text x="84" y="302" fill="#5c6f84" font-family="Arial, sans-serif" font-size="25" font-weight="400">
  <tspan x="84" dy="0">Integration and early flight-simulation results for the KADA</tspan>
  <tspan x="84" dy="34">KP2-c eVTOL across light and moderate steady-wind cases.</tspan>
</text>
        <rect x="84" y="432" width="210" height="112" rx="22" fill="#1f5f90"/>  <text x="106" y="468" fill="#dceafb" font-family="Arial, sans-serif" font-size="18" font-weight="700">WIND CASES</text>  <text x="106" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">10 and 20 knots</text>  <rect x="312" y="432" width="210" height="112" rx="22" fill="#3d7091"/>  <text x="334" y="468" fill="#dcecf5" font-family="Arial, sans-serif" font-size="18" font-weight="700">AIRCRAFT</text>  <text x="334" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">KADA KP2-c</text>  <rect x="540" y="432" width="210" height="112" rx="22" fill="#4d6b5f"/>  <text x="562" y="468" fill="#e2efe8" font-family="Arial, sans-serif" font-size="18" font-weight="700">METRIC</text>  <text x="562" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">Yaw-rate response</text>
        <rect x="808" y="124" width="288" height="430" rx="28" fill="#163550"/>
        <text x="846" y="160" fill="#dcecf8" font-family="Arial, sans-serif" font-size="19" font-weight="700">BROCHURE INSIGHTS</text>
        <rect x="850" y="180" width="78" height="52" rx="14" fill="#dce9f9"/>  <text x="868" y="213" fill="#1f4c77" font-family="Arial, sans-serif" font-size="18" font-weight="700">Twin</text>  <rect x="950" y="180" width="78" height="52" rx="14" fill="#dce9f9"/>  <text x="968" y="213" fill="#1f4c77" font-family="Arial, sans-serif" font-size="18" font-weight="700">Dynamics</text>  <rect x="900" y="270" width="78" height="52" rx="14" fill="#bfd6ee"/>  <text x="918" y="303" fill="#1f4c77" font-family="Arial, sans-serif" font-size="18" font-weight="700">Wind</text>
        <line x1="928" y1="232" x2="928" y2="270" stroke="#66bdd7" stroke-width="8" stroke-linecap="round"/>
        <line x1="972" y1="232" x2="950" y2="270" stroke="#66bdd7" stroke-width="8" stroke-linecap="round"/>
        <path d="M878 354 C918 314 978 314 1020 354" fill="none" stroke="#f4c35f" stroke-width="8" stroke-linecap="round"/>
        <path d="M878 382 C918 344 978 344 1020 382" fill="none" stroke="#66bdd7" stroke-width="8" stroke-linecap="round"/>
        <text x="846" y="498" fill="#dcecf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Moves the twin toward physics-grounded evaluation</text>  <text x="846" y="528" fill="#dcecf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Tracks yaw-rate shifts under steady wind loading</text>  <text x="846" y="558" fill="#dcecf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Future work points to flight-test validation</text>
        <text x="84" y="610" fill="#1f4c77" font-family="Arial, sans-serif" font-size="18" font-weight="700">KSAS Spring Conference 2025 - pages 381-382</text>
        <text x="84" y="638" fill="#5c6f84" font-family="Arial, sans-serif" font-size="17">Verified from the official KSAS proceedings PDF and publication metadata.</text>
      </svg>
