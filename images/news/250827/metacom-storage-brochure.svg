  <tspan x="84" dy="0">Stochastic reward nets for quantifying resilience in distributed</tspan>
  <tspan x="84" dy="34">storage backbones that support persistent immersive services.</tspan>
</text>
        <rect x="84" y="432" width="210" height="112" rx="22" fill="#0f4c81"/>  <text x="106" y="468" fill="#d7ebfb" font-family="Arial, sans-serif" font-size="18" font-weight="700">METHOD</text>  <text x="106" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">Reward nets</text>  <rect x="312" y="432" width="210" height="112" rx="22" fill="#406b8d"/>  <text x="334" y="468" fill="#e0e9f5" font-family="Arial, sans-serif" font-size="18" font-weight="700">TARGET</text>  <text x="334" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="26" font-weight="700">Distributed storage</text>  <rect x="540" y="432" width="210" height="112" rx="22" fill="#2f716b"/>  <text x="562" y="468" fill="#dcf0ec" font-family="Arial, sans-serif" font-size="18" font-weight="700">FOCUS</text>  <text x="562" y="510" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">High availability</text>
