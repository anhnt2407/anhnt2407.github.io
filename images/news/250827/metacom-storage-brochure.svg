        <rect x="850" y="180" width="78" height="52" rx="14" fill="#d9ebf9"/>  <text x="868" y="213" fill="#12406c" font-family="Arial, sans-serif" font-size="18" font-weight="700">Nodes</text>  <rect x="950" y="180" width="78" height="52" rx="14" fill="#d9ebf9"/>  <text x="968" y="213" fill="#12406c" font-family="Arial, sans-serif" font-size="18" font-weight="700">Replica</text>  <rect x="900" y="270" width="78" height="52" rx="14" fill="#c0d9ee"/>  <text x="918" y="303" fill="#12406c" font-family="Arial, sans-serif" font-size="18" font-weight="700">Service</text>
