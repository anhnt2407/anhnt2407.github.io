<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RT-VLM brochure card</title>
  <desc id="desc">Visual summary of RT-VLM, a vision-language model framework using four clues and a re-thinking loop for robust object recognition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9f4"/>
      <stop offset="100%" stop-color="#f8e3d0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2e7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="125" fill="#fdebd9"/>
  <circle cx="1060" cy="610" r="138" fill="#fff3e6"/>
  <rect x="48" y="48" width="1104" height="624" rx="34" fill="url(#panel)" stroke="#e1bb8f" stroke-width="2"/>
  <text x="84" y="102" fill="#7d4a13" font-family="Arial, sans-serif" font-size="22" font-weight="700">arXiv Preprint - September 1, 2025</text>
  <text x="84" y="170" fill="#4c2e10" font-family="Georgia, serif" font-size="50" font-weight="700">
    <tspan x="84" dy="0">RT-VLM and the</tspan>
    <tspan x="84" dy="56">Four-Clue Re-Thinking Loop</tspan>
  </text>
  <text x="84" y="302" fill="#71573f" font-family="Arial, sans-serif" font-size="25">
    <tspan x="84" dy="0">Structured evidence for robust recognition under viewpoint,</tspan>
    <tspan x="84" dy="34">occlusion, visual confusion, and low-level image shift.</tspan>
  </text>
  <rect x="84" y="432" width="170" height="106" rx="22" fill="#c7741e"/>
  <rect x="272" y="432" width="170" height="106" rx="22" fill="#a75835"/>
  <rect x="460" y="432" width="170" height="106" rx="22" fill="#7a466c"/>
  <rect x="648" y="432" width="170" height="106" rx="22" fill="#315d8c"/>
  <text x="106" y="470" fill="#fff1df" font-family="Arial, sans-serif" font-size="18" font-weight="700">CLUE 1</text>
  <text x="106" y="508" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">Boxes</text>
  <text x="294" y="470" fill="#fde8e1" font-family="Arial, sans-serif" font-size="18" font-weight="700">CLUE 2</text>
  <text x="294" y="508" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">Classes</text>
  <text x="482" y="470" fill="#f2e2f0" font-family="Arial, sans-serif" font-size="18" font-weight="700">CLUE 3</text>
  <text x="482" y="508" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">Captions</text>
  <text x="670" y="470" fill="#dce9f8" font-family="Arial, sans-serif" font-size="18" font-weight="700">CLUE 4</text>
  <text x="670" y="508" fill="#ffffff" font-family="Georgia, serif" font-size="26" font-weight="700">Scene Context</text>
  <rect x="838" y="116" width="248" height="444" rx="28" fill="#4c2e10"/>
  <rect x="882" y="176" width="160" height="84" rx="16" fill="#f7dfbd"/>
  <text x="918" y="210" fill="#6c4313" font-family="Arial, sans-serif" font-size="18" font-weight="700">Stage 1</text>
  <text x="888" y="236" fill="#6c4313" font-family="Arial, sans-serif" font-size="16">Generate 4 clues</text>
  <path d="M962 274 V328" stroke="#f7dfbd" stroke-width="8" stroke-linecap="round"/>
  <polygon points="962,346 948,322 976,322" fill="#f7dfbd"/>
  <rect x="882" y="366" width="160" height="84" rx="16" fill="#d5e7f8"/>
  <text x="918" y="400" fill="#315d8c" font-family="Arial, sans-serif" font-size="18" font-weight="700">Stage 2</text>
  <text x="887" y="426" fill="#315d8c" font-family="Arial, sans-serif" font-size="16">Re-think and revise</text>
  <circle cx="962" cy="500" r="36" fill="none" stroke="#f0b55b" stroke-width="10"/>
  <line x1="988" y1="526" x2="1020" y2="558" stroke="#f0b55b" stroke-width="10" stroke-linecap="round"/>
  <text x="84" y="610" fill="#7d4a13" font-family="Arial, sans-serif" font-size="18" font-weight="700">Robust visual understanding with structured evidence and self-correction.</text>
  <text x="84" y="638" fill="#7a624d" font-family="Arial, sans-serif" font-size="17">Posted on arXiv on September 1, 2025 - verified from the arXiv abstract page and DOI record.</text>
</svg>
