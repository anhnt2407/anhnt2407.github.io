<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scientific illustration of cooperative UAV delivery performance modeling</title>
  <desc id="desc">A dark cinematic scientific illustration showing UAV delivery routes over a city-scale digital map with charging nodes, glowing package handoff, and stochastic performance telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#102744"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="25%" r="74%">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.36"/>
      <stop offset="0.56" stop-color="#1b75a5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1b75a5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#8fd8ff" stroke-opacity="0.18" stroke-width="1.2"/>
    </pattern>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#63c9ff" flood-opacity="0.9"/>
    </filter>
    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffad5b" flood-opacity="0.86"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <style>
      .route{fill:none;stroke:#63c9ff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#blueGlow)}
      .route-warm{fill:none;stroke:#ffad5b;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 18;filter:url(#warmGlow)}
      .map{fill:none;stroke:#8fd8ff;stroke-opacity:.25;stroke-width:3;stroke-linecap:round}
      .node{fill:#08182a;stroke:#63c9ff;stroke-width:6;filter:url(#blueGlow)}
      .node-warm{fill:#20170d;stroke:#ffad5b;stroke-width:6;filter:url(#warmGlow)}
      .panel{fill:rgba(7,18,34,.78);stroke:rgba(143,216,255,.32);stroke-width:2}
      .ink{fill:#dcefff;font-family:Arial,sans-serif;font-weight:800;letter-spacing:0}
      .small{font-size:22px;opacity:.78}
      .drone{fill:#091626;stroke:#dcefff;stroke-width:5;stroke-linejoin:round;filter:url(#shadow)}
      .package{fill:#ffad5b;filter:url(#warmGlow)}
      .charge{fill:#63c9ff;filter:url(#blueGlow)}
      .spark{fill:#63c9ff;filter:url(#blueGlow)}
    </style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="34" fill="url(#glow)"/>
  <rect width="1200" height="675" rx="34" fill="url(#grid)"/>
  <path d="M0 220H58V168H106V220H160V138H214V232H270V184H320V238H392V124H448V226H510V164H562V240H648V110H708V230H766V176H826V244H900V140H960V228H1020V186H1076V242H1140V130H1200V675H0Z" fill="#050b15" opacity=".66"/>
  <path d="M0 534C194 462 320 570 512 496C724 416 842 518 1200 394V675H0Z" fill="#153554" opacity=".42"/>
  <path d="M0 606C252 528 432 582 650 510C850 444 1038 520 1200 470V675H0Z" fill="#06101d" opacity=".66"/>

  <g opacity=".75">
    <path class="map" d="M82 512H1124M122 456H1078M204 400H1130M172 334V620M342 300V642M534 292V628M742 276V626M970 316V642"/>
    <circle class="spark" cx="206" cy="510" r="5"/>
    <circle class="spark" cx="474" cy="432" r="5"/>
    <circle class="spark" cx="796" cy="374" r="5"/>
    <circle class="spark" cx="1044" cy="424" r="5"/>
  </g>

  <path class="route" d="M154 500C270 390 388 444 486 322S718 188 842 282S1002 432 1082 236"/>
  <path class="route-warm" d="M154 500C306 552 478 532 600 454S784 336 922 384"/>

  <circle class="node" cx="154" cy="500" r="30"/>
  <circle class="node-warm" cx="486" cy="322" r="30"/>
  <circle class="node" cx="842" cy="282" r="30"/>
  <circle class="node-warm" cx="1082" cy="236" r="30"/>
  <circle class="node-warm" cx="600" cy="454" r="26"/>
  <circle class="node" cx="922" cy="384" r="26"/>

  <g transform="translate(392 204)">
    <path class="drone" d="M112 70h76l42 28h-68l-12 28h-34l-12-28H38z"/>
    <circle class="node" cx="38" cy="98" r="28"/>
    <circle class="node" cx="230" cy="98" r="28"/>
    <line x1="66" y1="98" x2="104" y2="84" stroke="#dcefff" stroke-width="5" stroke-linecap="round"/>
    <line x1="202" y1="98" x2="166" y2="84" stroke="#dcefff" stroke-width="5" stroke-linecap="round"/>
    <rect class="package" x="112" y="118" width="42" height="34" rx="6"/>
  </g>

  <g transform="translate(784 122)">
    <path class="drone" d="M88 56h60l34 22h-54l-10 23H91L81 78H28z"/>
    <circle class="node" cx="28" cy="78" r="23"/>
    <circle class="node" cx="182" cy="78" r="23"/>
    <rect class="charge" x="92" y="98" width="34" height="27" rx="5"/>
  </g>

  <g transform="translate(760 462)" filter="url(#shadow)">
    <rect class="panel" width="342" height="112" rx="26"/>
    <text class="ink small" x="28" y="42">stochastic performance lens</text>
    <rect x="30" y="66" width="76" height="16" rx="8" fill="#63c9ff" filter="url(#blueGlow)"/>
    <rect x="120" y="66" width="112" height="16" rx="8" fill="#ffad5b" filter="url(#warmGlow)"/>
    <rect x="246" y="66" width="56" height="16" rx="8" fill="#69e6c1"/>
  </g>

  <g transform="translate(74 70)">
    <rect class="panel" width="340" height="108" rx="24"/>
    <text class="ink" x="28" y="45" font-size="30">UAV Delivery</text>
    <text class="ink small" x="28" y="78">battery-aware routing and package transfer</text>
  </g>
</svg>
