<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scientific illustration of cooperative UAV delivery performance modeling</title>
  <desc id="desc">A city logistics map with drones, charging stations, package handoff, stochastic metrics, and battery-aware routes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="0.54" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff4e8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2d75a0" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f2742" flood-opacity="0.16"/>
    </filter>
    <style>
      .route{fill:none;stroke:#1b75a5;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .route-soft{fill:none;stroke:#d87935;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 18}
      .node{fill:#fff;stroke:#1b75a5;stroke-width:6}
      .node-alt{fill:#fff7ed;stroke:#d87935;stroke-width:6}
      .panel{fill:rgba(255,255,255,.82);stroke:rgba(27,117,165,.24);stroke-width:2}
      .ink{fill:#17324d;font-family:Arial,sans-serif;font-weight:800;letter-spacing:0}
      .small{font-size:24px}
      .label{font-size:30px}
      .drone{fill:#ffffff;stroke:#17324d;stroke-width:5;stroke-linejoin:round}
      .accent{fill:#2b9a66}
      .orange{fill:#e89a3e}
      .blue{fill:#1b75a5}
    </style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#sky)"/>
  <rect width="1200" height="675" rx="34" fill="url(#grid)"/>
  <path d="M0 520C180 454 276 574 458 502C650 426 782 514 1200 390V675H0Z" fill="#1b75a5" opacity="0.08"/>

  <g opacity="0.56">
    <path d="M86 500H1118M104 436H1058M154 372H1110M222 308H1012" stroke="#17324d" stroke-opacity="0.14" stroke-width="3"/>
    <path d="M178 260V580M318 218V612M472 194V590M646 210V612M814 182V566M982 222V610" stroke="#17324d" stroke-opacity="0.12" stroke-width="3"/>
  </g>

  <path class="route" d="M154 496C264 386 392 440 486 322S718 184 842 282S1000 430 1082 238"/>
  <path class="route-soft" d="M154 496C310 552 474 534 600 454S784 336 922 384"/>

  <g filter="url(#softShadow)">
    <circle class="node" cx="154" cy="496" r="30"/>
    <circle class="node-alt" cx="486" cy="322" r="30"/>
    <circle class="node" cx="842" cy="282" r="30"/>
    <circle class="node-alt" cx="1082" cy="238" r="30"/>
    <circle class="node-alt" cx="600" cy="454" r="26"/>
    <circle class="node" cx="922" cy="384" r="26"/>
  </g>

  <g transform="translate(103 448)">
    <rect class="accent" x="33" y="24" width="36" height="28" rx="6"/>
    <path class="blue" d="M28 20h46l-23-18z"/>
  </g>
  <g transform="translate(566 416)">
    <rect class="orange" x="22" y="18" width="42" height="32" rx="6"/>
    <path class="blue" d="M18 16h50l-25-18z" opacity="0.82"/>
  </g>

  <g transform="translate(396 206)" filter="url(#softShadow)">
    <path class="drone" d="M112 70h76l42 28h-68l-12 28h-34l-12-28H38z"/>
    <circle class="node" cx="38" cy="98" r="28"/>
    <circle class="node" cx="230" cy="98" r="28"/>
    <line x1="66" y1="98" x2="104" y2="84" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <line x1="202" y1="98" x2="166" y2="84" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <rect class="orange" x="112" y="118" width="42" height="34" rx="6"/>
  </g>

  <g transform="translate(783 124)" filter="url(#softShadow)">
    <path class="drone" d="M88 56h60l34 22h-54l-10 23H91L81 78H28z"/>
    <circle class="node" cx="28" cy="78" r="23"/>
    <circle class="node" cx="182" cy="78" r="23"/>
    <rect class="accent" x="92" y="98" width="34" height="27" rx="5"/>
  </g>

  <g transform="translate(74 72)">
    <rect class="panel" width="346" height="118" rx="24"/>
    <text class="ink label" x="32" y="46">UAV Delivery</text>
    <text class="ink small" x="32" y="82" opacity="0.74">battery-aware routing and package transfer</text>
  </g>

  <g transform="translate(742 474)">
    <rect class="panel" width="360" height="104" rx="24"/>
    <text class="ink small" x="28" y="42">Stochastic performance lens</text>
    <rect x="28" y="64" width="70" height="16" rx="8" fill="#2b9a66"/>
    <rect x="112" y="64" width="96" height="16" rx="8" fill="#1b75a5"/>
    <rect x="222" y="64" width="54" height="16" rx="8" fill="#e89a3e"/>
    <text class="ink" x="294" y="79" font-size="18" opacity="0.72">time / charge / fleet</text>
  </g>
</svg>
