- slug: "robotics"
  label: "Robotics and mobility"
  span: "2025 – now"
  accent: "teal"
  blurb: >-
    Industry development programmes in Vietnam: humanoid robotics at VinDynamics, and the avionics
    workstream of a national rotorcraft programme.

- slug: "twin"
  label: "AI digital twins for air mobility"
  span: "2020 – 2029"
  accent: "indigo"
  blurb: >-
    Korean national research grants hosted at Konkuk University: a nine-year centre for UAM digital
    twins, a middle-career grant on resilient smart-city services, certified neural flight control,
    and a mobility talent programme run as applied R&D.

- slug: "cloud"
  label: "Dependable cloud and network infrastructure"
  span: "2014 – 2020"
  accent: "blue"
  blurb: >-
    Quantitative dependability applied to operating infrastructure: active-active clouds,
    software-defined networks, hybrid cloud economics, naval survivability, and the reliability of
    an early unmanned aircraft.

- slug: "space"
  label: "Space, UAV and embedded systems"
  span: "2009 – 2015"
  accent: "amber"
  blurb: >-
    Small flight and space platforms built for training and survey work: a CubeSat in Hanoi, then
    unmanned airships, balloon payloads and survey aircraft in Seoul, where redundancy and
    survivability were design requirements rather than analysis.
