  summary: >-
    The Retraction Watch database was acquired by Crossref and made a public resource, so retractions and corrections now surface through the Crossref API and an openly licensed dataset covering tens of thousands of records reaching back to the 1970s. PubPeer hosts the post-publication comment threads that often precede a retraction.
  takeaway: >-
    Worth running across a reference list before submission. A retracted citation is cheap to catch beforehand and expensive to explain afterwards.
