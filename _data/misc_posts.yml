    Papers with Code closed in July 2025, taking with it around fifteen hundred leaderboards and the links between papers and their implementations. Hugging Face now carries the nearest replacement through its papers feed, model hub and hosted leaderboards, but the unified task-level view has not been rebuilt.
  takeaway: >-
    A reminder that community infrastructure is not permanent. Archive the benchmark table your paper depends on instead of linking to it and hoping.
  links:
    - label: "Hugging Face papers"
      url: "https://huggingface.co/papers"
    - label: "Leaderboards"
      url: "https://huggingface.co/docs/leaderboards"
    - label: "What happened"
      url: "https://www.coursera.org/articles/papers-with-code"

