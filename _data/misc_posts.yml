  visual: "integrity"
  summary: >-
    A short checklist for judging whether a journal or conference can be trusted, paired with the DOAJ whitelist of vetted open access journals. The working sequence is to confirm indexing, verify the ISSN at the ISSN Portal, check COPE or OASPA membership, then look up two or three members of the editorial board.
  takeaway: >-
    Predatory venues routinely claim a DOAJ listing they do not hold. Verify outward from the directory, never inward from the journal's own page.
