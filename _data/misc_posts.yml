- number: "58"
  title: >-
    Assurance standards for autonomous and cyber-physical systems
  category: "Standards"
  topic: "reference"
  theme: "Certification baseline"
  year: "Current"
  source: "RTCA / SAE / ISO"
  tone: "violet"
  image: "/images/misc/058-assurance-standards.webp"
  image_alt: "An aircraft hangar at night with a quadcopter drone on the floor and four stacked horizontal luminous grid sheets above it, one cell left as an amber gap"
  visual: "standards"
  summary: >-
    The certification stack that dependable autonomy work eventually meets: ARP4754A for aircraft and system development, DO-178C for airborne software and DO-254 for airborne hardware, ISO 26262 with its ASIL A to D scale on the automotive side, and ISO 23247 for the manufacturing digital twin framework, whose part on the digital thread was published in 2026.
  takeaway: >-
    None of these were written with learning-enabled components in mind. That gap is precisely where much of the current advanced air mobility assurance research sits.
  links:
    - label: "ISO 26262"
      url: "https://www.iso.org/standard/68383.html"
