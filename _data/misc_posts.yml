- number: "59"
  title: >-
    ORCID, ROR and the persistent identifier layer
  category: "Identifiers"
  topic: "reference"
  theme: "Who wrote what, where"
  year: "Current"
  source: "ORCID / ROR / Crossref"
  tone: "cyan"
  image: "/images/misc/059-orcid-ror-doi.webp"
  image_alt: "A registry hall at night with a luminous human silhouette at the centre and fine threads binding it to floating documents, building outlines and small tokens"
  visual: "identity"
  summary: >-
    A researcher accumulates several identifiers issued by unrelated organisations, an ORCID iD, a Scopus Author ID and a Web of Science ResearcherID, which can be linked to each other but are never merged into one. ROR does the same job for institutions and DOIs for the works themselves.
  takeaway: >-
    Link them once and keep ORCID authoritative. Every downstream system, from dblp to funding agencies, resolves ambiguity by asking it first.
  links:
    - label: "ORCID"
      url: "https://orcid.org/"
    - label: "ROR"
      url: "https://ror.org/"
    - label: "Crossref"
      url: "https://www.crossref.org/"

- number: "60"
  title: >-
    arXiv and OpenReview
  category: "Preprints & Review"
  topic: "reference"
  theme: "The open record"
  year: "Current"
  source: "arXiv / OpenReview"
  tone: "green"
  image: "/images/misc/060-arxiv-openreview.webp"
  image_alt: "A quiet reading room at night with a luminous stream of documents flowing in through a high window and a transparent annotation layer overlaid on it"
  visual: "preprint"
  summary: >-
    arXiv remains the default preprint venue for computing, but since late 2025 its computer science category no longer accepts survey or position papers unless they have already cleared peer review, a direct response to a flood of machine-generated submissions. OpenReview holds the public review threads for most major AI conferences.
  takeaway: >-
    OpenReview is badly underused as a reading source. For a contested paper, the reviews often teach more than the paper itself.
  links:
    - label: "arXiv"
      url: "https://arxiv.org/"
    - label: "OpenReview"
      url: "https://openreview.net/"
