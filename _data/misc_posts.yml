  summary: >-
    Vietnam now maintains two lists that matter. The Ministry of Science and Technology issued the first national list of journals meeting Vietnamese science standards in April 2026 under Decision 2244/QĐ-BKHCN, recognising 341 titles, while the State Council of Professors continues to publish the annual scored list used for academic titles and promotion.
  takeaway: >-
