include:
  - _pages
exclude:
  - .vscode
  - .sass-cache
  - .jekyll-assets-cache
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - scripts
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - _drafts
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  research:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Ho_Chi_Minh

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
